name: hika_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  # Pinned below 11.0.0: that version's Android plugin hardcodes compileSdk 37, a preview SDK
  # platform that isn't cleanly installable in this environment. 10.3.1 only needs compileSdk 36.
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
