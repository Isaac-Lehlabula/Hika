name: hika_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  # Pinned below 11.0.0: that version's Android plugin hardcodes compileSdk 37, a preview SDK
  # platform that isn't cleanly installable in this environment. 10.3.1 only needs compileSdk 36.
  flutter_secure_storage: ^11.0.0
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
