name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Hika.slnx
        working-directory: backend

      - name: Build
        run: dotnet build Hika.slnx --no-restore --configuration Release
        working-directory: backend

      - name: Test
        run: dotnet test Hika.slnx --no-build --configuration Release --logger "console;verbosity=normal"
        working-directory: backend
