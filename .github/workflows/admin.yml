name: Admin Portal

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/admin.yml"
  pull_request:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/admin.yml"
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: admin

      - name: Lint
        run: npm run lint
        working-directory: admin

      - name: Build
        # A real API_BASE_URL isn't available in CI — `next build` only needs it to be a
        # syntactically valid value at build time (it's read at request time, not build time,
        # since every fetch happens in a Server Action/Component, never inlined into the
        # client bundle), so a placeholder is sufficient here.
        run: npm run build
        working-directory: admin
        env:
          API_BASE_URL: http://localhost:5080
